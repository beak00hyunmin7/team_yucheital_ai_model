# 자동 생성 (scripts/scaling_study.py). 기반: config_p2_wet8.yaml
# 학습 지형 수 = 전체 외에는 기반 config 와 동일.
# 직접 수정하지 말고 기반 config 를 고친 뒤 다시 생성할 것.

contours_dir: data/contours
flow_dir: data/flow
