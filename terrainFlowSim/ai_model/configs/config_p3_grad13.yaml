# Phase 2 — 목적함수 A/B: 젖은 픽셀 가중 L1 (실험군)
#
# IMPROVEMENT_GUIDE.md Phase 0-B 결과, v5는 "학습에 쓴 지형에서도" 최대 수심을
# 절반으로 예측한다(train 0.546 / val 0.509). 일반화 실패가 아니라 균등 L1이
# 소수 픽셀인 배수채널을 뭉개는 쪽을 선호하기 때문이라는 가설을 검증한다.
#
# 두 config 는 wet_weight 하나만 다르다. v5(256px/GAN/55epoch)와 비교하면
# 무엇 때문에 달라졌는지 알 수 없으므로 반드시 이 쌍끼리 비교할 것.
#
# 축소 설정을 쓰는 이유: 절대 성능이 아니라 두 조건의 차이를 보는 실험이라
# 128px/ngf32/GAN없음으로 낮춰 1회 학습을 수십 분대로 줄였다. 두 조건 모두
# 같은 축소 설정이므로 비교는 유효하다.

contours_dir: "data/contours"
flow_dir: "data/flow"
rain_values_json: "data/rain_values.json"
time_values_json: "data/time_values.json"

image_size: 128
ngf: 32
val_split: 0.15
seed: 42

mode: "unet"
gan_loss: "lsgan"
batch_size: 16
num_workers: 4
epochs: 45
lr: 0.0002
beta1: 0.5
lambda_l1: 100.0
wet_weight: 8.0

save_epoch_freq: 10
sample_epoch_freq: 2
log_iter_freq: 200
patience: 10

checkpoint_dir: "checkpoints_p3_grad13"
output_dir: "outputs_p3_grad13"

# Phase 3 — 기울기(고주파) 손실. wet8 에서 grad_weight 만 추가한 조건.
#
# 진단(scripts/diagnose_sharpness.py): 피크 과소예측의 정체는 크기 축소가 아니라
# **번짐**이었다. 예측이 정답을 sigma≈2.2픽셀로 흐린 것과 같았고, 얕은 구간은 오히려
# 과대예측(1.70배)·가장 깊은 구간만 과소예측(0.74배)이라 물이 봉우리에서 주변으로
# 옮겨간 형태였다. 값의 L1 은 번짐을 벌하지 못하므로 기울기를 맞추라고 요구한다.
#
# grad_weight 선정 근거: 실제 val 데이터에서 젖은가중 L1 = 0.0523, 기울기 L1 = 0.0199
# 로 비율이 2.63 이다. 즉 grad_weight=2.63 이면 두 항의 크기가 같아진다.
# 이 조건은 기울기 항이 L1 항의 0.5배 (1.3).
grad_weight: 1.3
grad_scales: [1, 2, 4]
