<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>예측 배수맵</title>
<style>
  :root {
    --bg: #0f1720; --panel: #182430; --panel-2: #1f2e3d; --line: #2c3e50;
    --text: #e8eef4; --muted: #9fb0c0; --accent: #2f9be6; --accent-2: #1d6fb8;
    --danger: #e5534b; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5;
  }
  header {
    padding: 20px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  #health { margin-left: auto; font-size: 12px; color: var(--muted); }
  #health b { color: var(--ok); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 15px; letter-spacing: .02em; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button {
    background: var(--panel-2); color: var(--text); border: 0; padding: 9px 16px;
    font-size: 13px; cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; font-weight: 600; }

  input[type=file] {
    width: 100%; padding: 10px; background: var(--panel-2);
    border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); font-size: 13px;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 7px; }

  .rain-row { display: flex; align-items: center; gap: 14px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=number] {
    width: 90px; padding: 8px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; color: var(--text); font-size: 13px;
  }
  .rain-val { font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }

  button.run {
    background: var(--accent); color: #fff; border: 0; border-radius: 9px;
    padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.run:disabled { opacity: .5; cursor: not-allowed; }

  .samples { display: flex; gap: 8px; flex-wrap: wrap; }
  .samples img {
    width: 62px; height: 62px; object-fit: cover; border-radius: 7px;
    border: 2px solid transparent; cursor: pointer;
  }
  .samples img.sel { border-color: var(--accent); }

  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .results figure { margin: 0; background: var(--panel-2); border-radius: 10px; padding: 12px; }
  .results figcaption { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .results img { width: 100%; border-radius: 6px; display: block; background: #fff; }
  .results a { font-size: 12px; color: var(--accent); text-decoration: none; display: inline-block; margin-top: 8px; }
  @media (max-width: 720px) { .results { grid-template-columns: 1fr; } }

  #err { color: var(--danger); font-size: 13px; white-space: pre-wrap; display: none; }
  #meta { font-size: 12px; color: var(--muted); margin-top: 14px; white-space: pre-wrap; }
  .spinner {
    display: none; width: 16px; height: 16px; border: 2px solid var(--muted);
    border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-left: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notes { font-size: 12px; color: var(--muted); margin-top: 10px; padding-left: 18px; }

  /* 로그인 화면 */
  #authView { max-width: 380px; margin: 60px auto; padding: 0 24px; }
  #authView h2 { font-size: 17px; margin: 0 0 4px; }
  #authView p.tag { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  #authView .card { padding: 24px; }
  #authView input[type=email], #authView input[type=password] {
    width: 100%; padding: 11px 12px; margin-top: 6px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 14px;
  }
  #authView .field { margin-bottom: 16px; }
  #authView button.run { width: 100%; margin-top: 4px; }
  .auth-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #authErr { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
  header .who { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  header .who button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>예측 배수맵</h1>
  <span class="sub">등고선 → AI 예측 배수(지표 유출 집중) 맵</span>
  <span id="health">모델 상태 확인 중…</span>
  <span class="who" id="who" style="display:none">
    <span id="whoEmail"></span>
    <button id="logout">로그아웃</button>
  </span>
</header>

<div id="authView" style="display:none">
  <h2 id="authTitle">로그인</h2>
  <p class="tag">예측 기능을 쓰려면 로그인이 필요합니다.</p>
  <div class="card">
    <div class="field">
      <label class="lbl">이메일</label>
      <input type="email" id="authEmail" autocomplete="username" />
    </div>
    <div class="field">
      <label class="lbl">비밀번호 <span id="pwHint" style="display:none">(6자 이상)</span></label>
      <input type="password" id="authPw" autocomplete="current-password" />
    </div>
    <button class="run" id="authSubmit">로그인</button>
    <div id="authErr"></div>
    <div class="auth-toggle" id="authToggle">
      계정이 없으신가요? <a id="authSwitch">회원가입</a>
    </div>
  </div>
</div>

<main id="appView" style="display:none">
  <section class="card">
    <h2>1. 입력 방식</h2>

    <div class="field">
      <label class="lbl">데이터 종류 (실무에서 다루는 자료에 맞춰 선택)</label>
      <div class="seg" id="modeSeg">
        <button data-mode="image" class="active">등고선 이미지</button>
        <button data-mode="terrain">등고선 데이터 (고도 격자)</button>
      </div>
      <div class="hint" id="modeHint"></div>
    </div>

    <div class="field">
      <label class="lbl" id="fileLbl">등고선 이미지 파일</label>
      <input type="file" id="file" />
      <div class="hint" id="fileHint"></div>
    </div>

    <div class="field" id="dxField" style="display:none">
      <label class="lbl">격자 셀 크기 dx [m] — 등고선 데이터에 해상도 정보가 없을 때만 사용</label>
      <input type="number" id="dx" value="10.4166667" step="0.1" min="0.01" />
      <div class="hint">.asc/.grd 파일은 헤더의 cellsize 를 자동으로 씁니다. 이미지 모양엔 거의 영향이 없어요.</div>
    </div>

    <div class="field" id="sampleField">
      <label class="lbl">또는 샘플 등고선으로 바로 테스트</label>
      <div class="samples" id="samples"></div>
    </div>
  </section>

  <section class="card">
    <h2>2. 강우 조건</h2>
    <div class="field">
      <label class="lbl" id="rainLbl">강우량 (mm)</label>
      <div class="rain-row">
        <input type="range" id="rainRange" min="20" max="80" step="1" value="50" />
        <input type="number" id="rainNum" min="0" max="200" step="1" value="50" />
        <span class="rain-val" id="rainOut">50 mm</span>
      </div>
      <div class="hint" id="rainHint">학습 범위는 20~80mm 입니다. 범위를 벗어난 값은 경계값처럼 처리됩니다.</div>
    </div>
  </section>

  <section class="card">
    <button class="run" id="run">예측 실행</button>
    <span class="spinner" id="spin"></span>
    <div id="err"></div>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <h2>3. 결과</h2>

    <figure id="analysisFig" style="margin:0 0 22px; display:none">
      <figcaption style="font-size:12px;color:var(--muted);margin-bottom:8px">
        예측 배수맵 — 실제 등고선(m) · 음영기복 · 배수구 설치 후보(★)
      </figcaption>
      <img id="imgAnalysis" alt="" style="width:100%;max-width:760px;border-radius:8px;background:#fff;display:block" />
      <a id="dlAnalysis" download="analysis.png" style="font-size:12px;color:var(--accent);text-decoration:none;display:inline-block;margin-top:8px">PNG 저장</a>
    </figure>

    <p id="rawHeading" style="font-size:12px;color:var(--muted);margin:0 0 10px;display:none">
      아래는 같은 예측의 모델 원본 출력입니다 (256px, 후처리 전).
    </p>
    <div class="results">
      <figure>
        <figcaption>입력 등고선 (모델에 들어간 이미지)</figcaption>
        <img id="imgContour" alt="" />
        <a id="dlContour" download="contour.png">PNG 저장</a>
      </figure>
      <figure>
        <figcaption id="predCap">예측 배수맵</figcaption>
        <img id="imgPred" alt="" />
        <a id="dlPred" download="prediction.png">PNG 저장</a>
      </figure>
      <figure id="overlayFig">
        <figcaption>오버레이 (등고선 + 예측)</figcaption>
        <img id="imgOverlay" alt="" />
        <a id="dlOverlay" download="overlay.png">PNG 저장</a>
      </figure>
    </div>
    <ul class="notes" id="notes"></ul>
    <div id="meta"></div>
  </section>
</main>

<script>
const API = location.origin;
let mode = "image";
let selectedSample = null;   // 샘플 이미지 blob (있으면 파일 대신 전송)

const $ = (id) => document.getElementById(id);

// ---- 인증 상태 ----
let authRequired = false;
let authMode = "login";               // "login" | "signup"
const tok = {
  get: () => localStorage.getItem("yuche_token") || "",
  set: (t) => localStorage.setItem("yuche_token", t),
  clear: () => localStorage.removeItem("yuche_token"),
};

function showApp(email) {
  $("authView").style.display = "none";
  $("appView").style.display = "";
  if (email) { $("who").style.display = "flex"; $("whoEmail").textContent = email; }
}
function showAuth() {
  $("authView").style.display = "";
  $("appView").style.display = "none";
  $("who").style.display = "none";
}

async function initAuth(health) {
  authRequired = !!health.auth_enabled;
  if (!authRequired) { showApp(); return; }        // MySQL 미연결 → 로그인 없이 사용
  if (tok.get()) {
    try {
      const r = await fetch(API + "/api/auth/me", { headers: { Authorization: "Bearer " + tok.get() } });
      if (r.ok) { showApp((await r.json()).email); return; }
    } catch {}
    tok.clear();
  }
  showAuth();
}

function renderAuthMode() {
  const signup = authMode === "signup";
  $("authTitle").textContent = signup ? "회원가입" : "로그인";
  $("authSubmit").textContent = signup ? "회원가입" : "로그인";
  $("pwHint").style.display = signup ? "" : "none";
  $("authToggle").innerHTML = signup
    ? '이미 계정이 있으신가요? <a id="authSwitch">로그인</a>'
    : '계정이 없으신가요? <a id="authSwitch">회원가입</a>';
  $("authSwitch").onclick = () => { authMode = signup ? "login" : "signup"; renderAuthMode(); };
  $("authErr").style.display = "none";
}

$("authSubmit").addEventListener("click", async () => {
  const email = $("authEmail").value.trim();
  const password = $("authPw").value;
  const e = $("authErr");
  e.style.display = "none";
  if (!email || !password) { e.textContent = "이메일과 비밀번호를 입력하세요."; e.style.display = "block"; return; }
  try {
    const r = await fetch(API + "/api/auth/" + authMode, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    tok.set(d.token);
    showApp(d.email);
  } catch (err) {
    e.textContent = err.message; e.style.display = "block";
  }
});
$("authPw").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("authSubmit").click(); });

$("logout").addEventListener("click", () => { tok.clear(); location.reload(); });

const MODE_TEXT = {
  image: {
    hint: "matplotlib terrain 스타일(20단계 채색 + 검은 등고선)로 렌더링된 등고선 이미지. 학습 데이터와 스타일이 비슷할수록 정확합니다.",
    fileLbl: "등고선 이미지 파일",
    fileHint: "PNG / JPG / WEBP",
    accept: "image/*",
  },
  terrain: {
    hint: "고도값 격자 자체를 올리면 서버가 학습 때와 동일한 방식으로 등고선 이미지를 만들어 예측합니다. 스타일 불일치 걱정이 없어 가장 정확합니다.",
    fileLbl: "등고선 데이터 파일",
    fileHint: ".npy · .csv · .txt · .dat · .asc · .grd · .tif/.tiff · (회색조 높이맵 .png/.jpg)",
    accept: ".npy,.csv,.txt,.dat,.asc,.grd,.tif,.tiff,.png,.jpg,.jpeg,.webp",
  },
};

function applyMode() {
  const t = MODE_TEXT[mode];
  $("modeHint").textContent = t.hint;
  $("fileLbl").textContent = t.fileLbl;
  $("fileHint").textContent = t.fileHint;
  $("file").setAttribute("accept", t.accept);
  $("dxField").style.display = mode === "terrain" ? "" : "none";
  $("sampleField").style.display = mode === "image" ? "" : "none";
}

$("modeSeg").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  mode = btn.dataset.mode;
  [...$("modeSeg").children].forEach((b) => b.classList.toggle("active", b === btn));
  selectedSample = null;
  [...$("samples").children].forEach((i) => i.classList.remove("sel"));
  applyMode();
});

$("file").addEventListener("change", () => {
  selectedSample = null;
  [...$("samples").children].forEach((i) => i.classList.remove("sel"));
});

// 강우 슬라이더 <-> 숫자 동기화
function syncRain(v) {
  v = Math.max(0, Math.min(200, Math.round(v)));
  $("rainRange").value = Math.max(20, Math.min(80, v));
  $("rainNum").value = v;
  $("rainOut").textContent = v + " mm";
}
$("rainRange").addEventListener("input", (e) => syncRain(+e.target.value));
$("rainNum").addEventListener("input", (e) => syncRain(+e.target.value));

// 헬스체크 + 인증 초기화
renderAuthMode();
fetch(API + "/api/health").then((r) => r.json()).then((h) => {
  const rain = h.rain_conditioned
    ? `강우 조건 반영 (${h.rain_range_mm[0]}~${h.rain_range_mm[1]}mm)`
    : "강우 조건 미반영 모델";
  const db = h.auth_enabled ? "" : " · DB미연결(로그인 생략)";
  $("health").innerHTML = `<b>●</b> ${h.checkpoint} · ${h.device.toUpperCase()} · ${rain}${db}`;
  if (!h.rain_conditioned) {
    $("rainHint").textContent = "현재 로드된 체크포인트는 강우 조건을 쓰지 않습니다. 강우량 값은 무시됩니다.";
    $("rainRange").disabled = $("rainNum").disabled = true;
  }
  initAuth(h);
}).catch(() => { $("health").textContent = "모델 상태를 불러오지 못했습니다"; showApp(); });

// 샘플 목록
fetch(API + "/api/samples").then((r) => r.json()).then(({ samples }) => {
  const box = $("samples");
  samples.forEach((name) => {
    const img = document.createElement("img");
    img.src = API + "/api/sample/" + encodeURIComponent(name);
    img.title = name;
    img.addEventListener("click", async () => {
      const blob = await (await fetch(img.src)).blob();
      selectedSample = new File([blob], name, { type: "image/png" });
      [...box.children].forEach((i) => i.classList.toggle("sel", i === img));
      $("file").value = "";
    });
    box.appendChild(img);
  });
});

$("run").addEventListener("click", async () => {
  const err = $("err");
  err.style.display = "none";

  const upload = selectedSample || $("file").files[0];
  if (!upload) { err.textContent = "파일을 선택하거나 샘플을 골라주세요."; err.style.display = "block"; return; }

  const fd = new FormData();
  fd.append("mode", mode);
  fd.append("rain_mm", $("rainNum").value);
  fd.append("dx", $("dx").value);
  fd.append("file", upload);

  $("run").disabled = true;
  $("spin").style.display = "inline-block";
  try {
    const headers = tok.get() ? { Authorization: "Bearer " + tok.get() } : {};
    const res = await fetch(API + "/api/predict", { method: "POST", body: fd, headers });
    if (res.status === 401) {
      tok.clear(); showAuth();
      throw new Error("세션이 만료되었습니다. 다시 로그인해 주세요.");
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));

    const set = (imgId, dlId, b64) => {
      const url = "data:image/png;base64," + b64;
      $(imgId).src = url; $(dlId).href = url;
    };
    set("imgContour", "dlContour", data.contour_png_base64);
    set("imgPred", "dlPred", data.prediction_png_base64);
    set("imgOverlay", "dlOverlay", data.overlay_png_base64);

    const hasMap = !!data.analysis_png_base64;   // 등고선 데이터 모드
    if (hasMap) set("imgAnalysis", "dlAnalysis", data.analysis_png_base64);
    $("analysisFig").style.display = hasMap ? "" : "none";
    // 지도가 있으면 아래 3장은 '원본 출력' 참고용, 오버레이는 숨김(고도 컬러맵이 물처럼 보여 혼동)
    $("rawHeading").style.display = hasMap ? "" : "none";
    $("overlayFig").style.display = hasMap ? "none" : "";
    $("predCap").textContent = hasMap ? "모델 원본 출력 (256px)" : "예측 배수맵";

    const extra = [...(data.notes || [])];
    if (data.drain_candidate) {
      const p = data.drain_candidate.pixel;
      extra.push(`배수구 설치 후보(예측 유출 최대점): 픽셀 (${p.x}, ${p.y})`);
    }
    $("notes").innerHTML = extra.map((n) => `<li>${n}</li>`).join("");
    $("meta").textContent =
      `checkpoint: ${data.checkpoint}\n` + JSON.stringify(data.meta, null, 2);
    $("resultCard").style.display = "";
    $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    err.textContent = "예측 실패: " + e.message;
    err.style.display = "block";
  } finally {
    $("run").disabled = false;
    $("spin").style.display = "none";
  }
});

applyMode();
syncRain(50);
</script>
</body>
</html>
